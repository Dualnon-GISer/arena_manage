      }

      .status {
        gap: 6px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper-2);
        font-size: 13px;
      }

      .status i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }

      .status.running {
        background: var(--run-soft);
        border-color: color-mix(in srgb, var(--run-lamp) 33%, transparent);
      }

      .status.busy {
        background: var(--busy-soft);
        border-color: color-mix(in srgb, var(--busy-lamp) 33%, transparent);
      }

      .status.error {
        background: var(--error-soft);
        border-color: color-mix(in srgb, var(--error-lamp) 33%, transparent);
      }

      .prow-name {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .port {
        padding: 3px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper-2);
        color: var(--ink-soft);
        font-size: 13px;
      }

      .port.port-auto {
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--dim);
        font-size: 13px;
      }

      .prow-bottom {
        gap: 16px;
        margin-top: 9px;
        padding-left: 108px;
      }

      .prow-meta {
        gap: 14px;
      }

      .prow-path {
        font-size: 13px;
      }

      .dep {
        gap: 6px;
        font-size: 13px;
      }

      .dep::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }

      .dep.ok {
        color: var(--run);
      }

      .dep.ok::before {
        background: var(--run-lamp);
      }

      .dep.warn {
        color: var(--busy);
      }

      .dep.warn::before {
        background: var(--busy-lamp);
      }

      .prow-tools {
        gap: 3px;
        margin-left: 6px;
        padding-left: 10px;
      }

      .project-error {
        margin: 10px 0 0 108px;
        padding: 8px 11px;
        border-radius: 9px;
        font-size: 13px;
      }

      /* 压缩包 */
      .arow {
        padding: 14px;
        transition: background 0.12s;
      }

      .arow:hover {
        background: color-mix(in srgb, var(--pine) 5%, var(--paper));
      }

      .arow-top {
        gap: 12px;
      }

      .arow-name {
        font-size: 14px;
      }

      .arow-top .btn {
        height: 33px;
        padding: 0 12px;
        font-size: 13px;
      }

      .arow-top .btn.archive-import {
        width: 33px;
        padding: 0;
        justify-content: center;
        flex-shrink: 0;
      }

      .arow-meta {
        gap: 10px;
        margin-top: 8px;
        font-size: 13px;
      }

      .tag {
        gap: 6px;
        padding: 3px 9px;
        border: 1px solid var(--line-soft);
        border-radius: 999px;
        background: var(--paper-2);
        font-size: 13px;
        color: var(--muted);
      }

      .tag::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ochre);
      }

      .tag.imported {
        color: var(--muted);
      }

      .tag.imported::before {
        background: var(--pine);
        box-shadow: none;
      }

      /* 空状态 */
      .empty h3 {
        font-size: 17px;
      }

      .empty p {
        font-size: 14px;
      }

      .empty .btn {
        margin-top: 16px;
      }

      .empty code {
        font-size: 13px;
      }

      .empty.small h3 {
        font-size: 15px;
      }

      .empty.small p {
        font-size: 13.5px;
      }

      .footer {
        font-size: 13px;
      }

      #root-info {
        font-size: 13px;
      }

      /* 弹窗 */
      #modal-root {
        padding: 26px;
      }

      .modal {
        border-color: var(--line);
        border-radius: 20px;
      }

      .modal-head {
        padding: 17px 22px;
      }

      .modal-head h3 {
        font-size: 17.5px;
      }

      .modal-body {
        gap: 17px;
        padding: 21px 22px;
      }

      .modal-foot {
        gap: 10px;
        padding: 14px 22px;
      }

      .import-file {
        gap: 13px;
        padding: 12px 14px;
        border-radius: 12px;
      }

      .file-badge {
        width: 40px;
        height: 44px;
        border-color: var(--line);
        border-radius: 4px 10px 10px 4px;
        background: var(--paper-2);
        box-shadow: inset 4px 0 0 var(--accent-solid);
        color: var(--ink-soft);
        font-family: var(--font-ui);
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .import-file strong {
        font-size: 13.5px;
      }

      .import-meta {
        font-size: 13px;
      }

      .field {
        gap: 8px;
        font-size: 13.5px;
      }

      .field input {
        height: 43px;
        padding: 0 13px;
        border-radius: 10px;
        font-size: 15.5px;
      }

      .steps {
        gap: 10px;
        font-size: 13.5px;
      }

      .step-num {
        width: 16px;
        height: auto;
        margin-top: 1px;
        display: block;
        flex-shrink: 0;
        border-radius: 0;
        background: transparent;
        color: var(--accent);
        font-family: var(--font-num);
        font-size: 13px;
        font-weight: 700;
      }

      .check {
        gap: 8px;
        font-size: 13.5px;
      }

      .check input {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        accent-color: var(--accent-solid);
      }

      .check.subtle {
        font-size: 13px;
      }

      .import-options {
        gap: 9px;
      }

      .confirm-text {
        font-size: 14px;
      }

      .hint-line {
        font-size: 13.5px;
      }

      .danger-note {
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 13px;
      }

      /* Git 面板 */
      .git-loading {
        font-size: 13px;
      }

      .git-summary {
        padding: 13px 14px;
        border-radius: 12px;
      }

      .git-row {
        gap: 10px;
        font-size: 13px;
      }

      .git-row .k {
        width: 68px;
        font-size: 12.5px;
      }

      .git-row code {
        padding: 2px 7px;
        border-radius: 6px;
        font-size: 13px;
      }

      .git-state::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }

      .git-section {
        gap: 8px;
      }

      .git-section-title {
        font-size: 13px;
      }

      .git-list {
        border-radius: 10px;
      }

      .git-change {
        gap: 10px;
        padding: 8px 12px;
        font-size: 13px;
      }

      .git-code {
        width: 24px;
        font-size: 12px;
      }

      .git-more {
        padding: 8px 12px;
        font-size: 12.5px;
      }

      .git-commit {
        gap: 10px;
        padding: 9px 12px;
      }

      .git-hash {
        font-size: 12px;
      }

      .git-subject {
        font-size: 13.5px;
      }

      .git-date {
        font-size: 12px;
      }

      .git-path {
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 12.5px;
      }

      .git-error {
        font-size: 13.5px;
      }

      /* 日志与提示 */
      .log-name {
        font-size: 17px;
      }

      .log-toolbar {
        gap: 14px;
        padding: 9px 18px;
        font-size: 13px;
      }

      .log-toolbar .hint {
        font-size: 13px;
      }

      .live {
        gap: 8px;
        font-size: 13px;
      }

      .live i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      .log-pre {
        padding: 16px 18px;
        font-size: 13.5px;
        line-height: 1.65;
      }

      .toast {
        gap: 9px;
        padding: 12px 15px;
        border-radius: 12px;
        font-size: 14px;
      }

      .toast .dot {
        width: 8px;
        height: 8px;
        margin-top: 5px;
        border-radius: 50%;
      }

      .toast.success {
        border-color: color-mix(in srgb, var(--run-lamp) 45%, var(--line));
      }

      .toast.error {
        border-color: color-mix(in srgb, var(--error-lamp) 45%, var(--line));
      }

      /* ---------- 响应式 ---------- */

      @media (max-width: 1080px) {
        .workbench {
          grid-template-columns: minmax(0, 1fr);
          gap: 24px;
        }
      }

      @media (max-width: 760px) {
        .shell {
          padding: 20px 18px 32px;
        }

        .topbar-actions {
          width: 100%;
        }

        /* 窄屏下让自动打开开关独占一行，避免“刷新”被挤成落单 */
        .topbar-actions .switch {
          order: 9;
          flex-basis: 100%;
        }

        /* 窄屏下页脚条目会折行，竖线会在行尾悬空；此时只留间距 */
        #env-info {
          gap: 3px 14px;
        }

        #env-info > .env-part:not(:last-child)::after {
          display: none;
        }

        .icon-btn {
          width: 30px;
          height: 30px;
        }

        .icon-btn svg {
          width: 16px;
          height: 16px;
        }

        /* 窄屏：三项并排成小表格，说明文字另起一行 */
        .rail {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 0;
        }

        .rail-item {
          flex-wrap: wrap;
          white-space: normal;
          padding: 8px 12px;
        }

        .rail-item + .rail-item {
          border-left: 1px solid var(--line-soft);
        }

        .rail-note {
          grid-column: 1 / -1;
          margin-left: 0;
          padding: 8px 12px;
          border-top: 1px solid var(--line-soft);
        }

        .prow-top {
          flex-wrap: wrap;
          justify-content: space-between;
        }

        .prow-state {
          flex: 0 0 auto;
          order: 1;
        }

        .prow-top .port {
          order: 2;
        }

        .prow-name {
          order: 3;
          flex-basis: 100%;
          margin-top: 2px;
        }

        .prow-bottom {
          display: block;
          padding-left: 0;
        }

        .prow-meta {
          margin-top: 2px;
          flex-wrap: wrap;
          gap: 6px 12px;
        }

        .prow-actions {
          margin-top: 9px;
          flex-wrap: wrap;
        }

        .prow-tools {
          margin-left: auto;
          padding-left: 0;
          border-left: 0;
        }

        .project-error {
          margin-left: 0;
        }

        #modal-root {
          padding: 12px;
        }

        .log-actions .check {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <!-- avoid-ai-design-ignore: SD5 中英双语产品名，不是强调单个词 -->
        <h1 class="wordmark"><span class="wordmark-main">Arena</span><span class="wordmark-sub">项目管理器</span></h1>
        <div class="topbar-actions">
          <span id="conn" class="conn"><i></i><span>连接中…</span></span>
          <div class="theme-switch" role="group" aria-label="主题">
            <button type="button" class="theme-option" data-theme-set="light" aria-pressed="false">浅色</button>
            <button type="button" class="theme-option" data-theme-set="dark" aria-pressed="false">深色</button>
          </div>
          <label class="switch" title="项目启动成功后自动在浏览器打开">
            <input type="checkbox" id="auto-open" />
            <span class="track" aria-hidden="true"></span>
            <span>启动后自动打开</span>
          </label>
          <button id="stop-all" class="btn ghost small" hidden>全部停止</button>
          <button id="refresh" class="btn ghost small">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0-2.3 5.7" />
              <path d="M20 4v7h-7" />
            </svg>
            刷新
          </button>
        </div>
      </header>

      <section class="rail" aria-label="概览">
        <span class="rail-item"><span class="rail-label">项目</span><span class="rail-value" id="stat-projects">0</span></span>
        <span class="rail-item">
          <span class="rail-label">运行中</span><span class="rail-value" id="stat-running">0</span>
          <span class="rail-sub" id="stat-running-sub">全部空闲</span>
        </span>
        <span class="rail-item">
          <span class="rail-label">压缩包</span><span class="rail-value" id="stat-archives">0</span>
          <span class="rail-sub" id="stat-archives-sub">暂无待导入</span>
        </span>
        <span class="rail-note" id="deps-note">依赖复用 pnpm 全局 store</span>
      </section>

      <main class="workbench">
        <section class="pane" aria-label="项目">
          <div class="pane-head">
            <h2>项目</h2>
            <span class="count" id="project-count">0 个</span>
            <div class="pane-actions">
              <button id="rescan" class="btn ghost small">重新扫描</button>
            </div>
          </div>
          <div id="projects" class="ledger"></div>
        </section>

        <aside class="pane" aria-label="压缩包">
          <div class="pane-head">
            <h2>压缩包</h2>
            <span class="count" id="archive-count">0 个</span>
          </div>
          <div id="archives" class="inbox"></div>
          <p class="pane-hint" id="root-hint">根目录中的 .zip 文件</p>
        </aside>
      </main>

      <footer class="footer">
        <span id="env-info">正在读取环境信息…</span>
        <span>仅监听 127.0.0.1</span>
        <span id="root-info"></span>
      </footer>
    </div>

    <div id="toasts" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script>
      (function () {
        "use strict";

        /* ------------------------------ 图标 ------------------------------ */
        const ICONS = {
          play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.7v12.6a.7.7 0 0 0 1.07.6l10-6.3a.7.7 0 0 0 0-1.2l-10-6.3A.7.7 0 0 0 8 5.7Z" fill="currentColor"/></svg>',
          stop: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>',
          external:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 13.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5.5"/></svg>',
          terminal:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 9.5 10 12l-3 2.5M12.5 15H17"/></svg>',
          package:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7.5 12 3 4 7.5v9L12 21l8-4.5z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>',
          folder:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h9A1.5 1.5 0 0 1 21 10v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18z"/></svg>',
          trash:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6.5 7l.8 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4l.8-12M10 11v5.5M14 11v5.5"/></svg>',
          refresh:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>',
          upload:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
          edit:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L20 8a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m14.5 5.5 4 4"/></svg>',
          git: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="5.5" r="2.3"/><circle cx="7" cy="18.5" r="2.3"/><circle cx="17" cy="9" r="2.3"/><path d="M7 7.8v8.4"/><path d="M17 11.3v.9a4 4 0 0 1-4 4H7"/></svg>',
          close:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>',
        };

        /* ------------------------------ 基础工具 ------------------------------ */
        const $ = (selector, root = document) => root.querySelector(selector);

        const state = {
          data: null,
          busy: new Set(),
          log: null,
          online: true,
        };

        const STATUS = {
          running: { label: '运行中', cls: 'running' },
          stopped: { label: '已停止', cls: 'stopped' },
          installing: { label: '安装依赖', cls: 'busy' },
          starting: { label: '启动中', cls: 'busy' },
          stopping: { label: '停止中', cls: 'busy' },
          error: { label: '异常', cls: 'error' },
        };

        const STATUS_ORDER = { running: 0, error: 1, starting: 2, installing: 3, stopping: 4, stopped: 5 };

        function esc(value) {
          return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
          });
        }

        function fmtBytes(bytes) {
          if (!bytes) return '0 B';
          const units = ['B', 'KB', 'MB', 'GB'];
          let value = bytes;
          let index = 0;
          while (value >= 1024 && index < units.length - 1) {
            value /= 1024;
            index += 1;
          }
          return `${value >= 10 || index === 0 ? Math.round(value) : value.toFixed(1)} ${units[index]}`;
        }

        function fmtDate(ms) {
          if (!ms) return '—';
          const date = new Date(ms);
          const pad = (n) => String(n).padStart(2, '0');
          return `${date.getMonth() + 1}月${date.getDate()}日 ${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function statusInfo(project) {
          return STATUS[project.status] || STATUS.stopped;
        }

        function findProject(id) {
          return state.data?.projects.find((project) => project.id === id) || null;
        }

        function safeUrl(url) {
          return typeof url === 'string' && /^https?:\/\/(127\.0\.0\.1|localhost)(:\d+)?\//.test(url)
            ? url
            : null;
        }

        async function api(path, options = {}) {
          const response = await fetch(path, {
            headers: { 'Content-Type': 'application/json' },
            ...options,
          });
          let payload = null;
          try {
            payload = await response.json();
          } catch {
            /* 非 JSON 响应 */
          }
          if (!response.ok) {
            throw new Error(payload?.error || `请求失败（HTTP ${response.status}）`);
          }
          return payload;
        }

        function toast(message, type = 'info') {
          const container = $('#toasts');
          const node = document.createElement('div');
          node.className = `toast ${type}`;
          node.innerHTML = `<span class="dot"></span><span>${esc(message)}</span>`;
          container.appendChild(node);
          setTimeout(() => {
            node.classList.add('leaving');
            setTimeout(() => node.remove(), 260);
          }, 4200);
        }

        /* ------------------------------ 加载与渲染 ------------------------------ */
        async function load() {
          try {
            const data = await api('/api/state');
            state.data = data;
            setConnection(true);
            render();
          } catch {
            setConnection(false);
          }
        }

        function setConnection(ok) {
          state.online = ok;
          const chip = $('#conn');
          chip.classList.toggle('bad', !ok);
          chip.querySelector('span').textContent = ok ? '已连接' : '连接中断';
        }

        let lastRenderKey = '';

        function render() {
          if (!state.data) return;
          updateLogHeader();

          // 状态没有变化时不重建 DOM，避免每 2 秒轮询造成闪烁
          const key = JSON.stringify({
            projects: state.data.projects,
            archives: state.data.archives,
            tools: state.data.tools,
            root: state.data.root,
            managerPort: state.data.managerPort,
            busy: [...state.busy],
          });
          if (key === lastRenderKey) return;
          lastRenderKey = key;

          renderStats();
          renderProjects();
          renderArchives();
          renderEnv();
        }

        function renderStats() {
          const projects = state.data.projects;
          const runningProjects = projects.filter((project) => project.status === 'running');
          const running = runningProjects.length;
          const archives = state.data.archives;
          const pending = archives.filter((archive) => archive.imported === 0).length;

          $('#stat-projects').textContent = projects.length;
          $('#stat-running').textContent = running;
          const runningPorts = runningProjects.map((project) => project.port).filter(Boolean);
          $('#stat-running-sub').textContent = running
            ? runningPorts.length
              ? `端口 ${runningPorts.map((port) => `:${port}`).join(' / ')}`
              : '正在分配端口'
            : '全部空闲';
          $('#stat-archives').textContent = archives.length;
          $('#stat-archives-sub').textContent = !archives.length
            ? '根目录为空'
            : pending
              ? `${pending} 个待导入`
              : '全部已导入';
          $('#project-count').textContent = `${projects.length} 个`;
          $('#archive-count').textContent = `${archives.length} 个`;
          $('#stop-all').hidden = running === 0;

          const pm = state.data.tools.packageManager;
          $('#deps-note').textContent =
            pm === 'pnpm' ? '依赖复用 pnpm 全局 store' : pm ? '依赖复用本地共享缓存' : '未找到包管理器';
          $('#root-hint').textContent = `根目录：${state.data.root}`;
          $('#root-hint').hidden = archives.length === 0;
        }

        function renderEnv() {
          const tools = state.data.tools;
          const parts = [`Node ${esc(tools.node)}`];
          if (tools.packageManager) {
            parts.push(`${esc(tools.packageManager)}${tools.pnpmVersion ? ` ${esc(tools.pnpmVersion)}` : ''}`);
          } else {
            parts.push('未找到包管理器');
          }
          parts.push(tools.extractor ? `解压 ${esc(tools.extractor)}` : '未找到解压工具');
          if (tools.gitVersion) parts.push(`Git ${esc(tools.gitVersion)}`);
          parts.push(`控制台 :${state.data.managerPort}`);
          $('#env-info').innerHTML = parts.map((part) => `<span class="env-part">${part}</span>`).join('');
          $('#root-info').textContent = state.data.root;
        }

        function depInfo(project) {
          if (project.status === 'installing') return { text: '依赖安装中', cls: 'warn' };
          if (project.depsInstalled) return { text: '依赖已安装', cls: 'ok' };
          if (project.hasNodeModules) return { text: '依赖待更新', cls: 'warn' };
          return { text: '依赖未安装', cls: 'dim' };
        }

        function renderProjects() {
          const container = $('#projects');
          const projects = [...state.data.projects].sort((a, b) => {
            const orderA = STATUS_ORDER[a.status] ?? 9;
            const orderB = STATUS_ORDER[b.status] ?? 9;
            if (orderA !== orderB) return orderA - orderB;
            return (b.createdAt || 0) - (a.createdAt || 0);
          });

          if (!projects.length) {
            const firstArchive = state.data.archives[0];
            container.innerHTML = `
              <div class="empty">
                <h3>还没有项目</h3>
                <p>把从大模型竞技场下载的 .zip 放到根目录，或从右侧压缩包导入。系统会自动解压并安装依赖。</p>
                ${
                  firstArchive
                    ? `<button class="btn primary" data-import="${esc(firstArchive.file)}">${ICONS.upload}导入 ${esc(firstArchive.file)}</button>`
                    : ''
                }
              </div>`;
            return;
          }

          container.innerHTML = projects.map(renderProjectRow).join('');
        }

        function renderProjectRow(project) {
          const info = statusInfo(project);
          const dep = depInfo(project);
          const localBusy = state.busy.has(project.id);
          const transitioning = ['installing', 'starting', 'stopping'].includes(project.status);
          const busy = project.busy || localBusy;
          const running = project.status === 'running';
          const url = safeUrl(project.url);
          const canStart = !busy && !transitioning;

          let primary;
          if (running) {
            primary = `<button class="btn stop" data-action="stop" ${busy ? 'disabled' : ''}>${ICONS.stop}停止</button>`;
          } else {
            const labels = {
              installing: '安装中…',
              starting: '启动中…',
              stopping: '停止中…',
            };
            const label = labels[project.status] || '启动';
            primary = `<button class="btn primary" data-action="start" ${
              canStart ? '' : 'disabled'
            }>${transitioning ? '<span class="mini-spinner"></span>' : ICONS.play}${label}</button>`;
          }

          const openLink = running && url
            ? `<a class="btn ghost" href="${esc(url)}" target="_blank" rel="noreferrer">${ICONS.external}打开</a>`
            : '';

          const installedTitle = project.installedAt
            ? `依赖安装于 ${fmtDate(project.installedAt)}`
            : '尚未安装依赖';

          return `
            <article class="prow ${running ? 'is-running' : ''} ${project.status === 'error' ? 'is-error' : ''}" data-id="${esc(project.id)}">
              <div class="prow-top">
                <span class="prow-state"><span class="status ${info.cls}"><i></i>${info.label}</span></span>
                <h3 class="prow-name">${esc(project.name)}</h3>
                ${
                  project.port
                    ? `<span class="port" title="端口 ${project.port}">:${project.port}</span>`
                    : '<span class="port port-auto">端口自动</span>'
                }
              </div>
              <div class="prow-bottom">
                <div class="prow-meta">
                  <span class="prow-path" title="${esc(project.dir)}">${esc(project.dir)}</span>
                  <span class="dep ${dep.cls}" title="${esc(installedTitle)}">${dep.text}</span>
                </div>
                <div class="prow-actions">
                  ${primary}
                  ${openLink}
                  <span class="prow-tools">
                    <button class="icon-btn" data-action="rename" title="${
                      running ? '重命名（会先停止项目）' : '重命名'
                    }" aria-label="重命名" ${busy ? 'disabled' : ''}>${ICONS.edit}</button>
                    <button class="icon-btn" data-action="git" title="${
                      project.hasGit ? 'Git 版本管理' : '初始化 Git 仓库'
                    }" aria-label="Git 版本管理">${ICONS.git}</button>
                    <button class="icon-btn" data-action="logs" title="查看日志" aria-label="查看日志">${ICONS.terminal}</button>
                    <button class="icon-btn" data-action="install" title="重新安装依赖" aria-label="重新安装依赖" ${
                      busy || running ? 'disabled' : ''
                    }>${ICONS.package}</button>
                    <button class="icon-btn" data-action="reveal" title="在文件夹中显示" aria-label="在文件夹中显示">${ICONS.folder}</button>
                    <button class="icon-btn danger" data-action="delete" title="删除项目" aria-label="删除项目" ${
                      busy ? 'disabled' : ''
                    }>${ICONS.trash}</button>
                  </span>
                </div>
              </div>
              ${project.error ? `<p class="project-error">${esc(project.error)}</p>` : ''}
            </article>`;
        }

        function renderArchives() {
          const container = $('#archives');
          const archives = state.data.archives;

          if (!archives.length) {
            container.innerHTML = `
              <div class="empty small">
                <h3>没有找到压缩包</h3>
                <p>把 .zip 文件放到 <code>${esc(state.data.root)}</code>，然后点击右上角「刷新」。</p>
              </div>`;
            return;
          }

          container.innerHTML = archives
            .map(
              (archive) => `
                <div class="arow">
                  <div class="arow-top">
                    <span class="arow-name">${esc(archive.file)}</span>
                    <button class="btn small ghost archive-import" data-import="${esc(archive.file)}" title="导入 ${esc(archive.file)}" aria-label="导入 ${esc(archive.file)}">${ICONS.upload}</button>
                  </div>
                  <div class="arow-meta">
                    <span>${fmtBytes(archive.size)}，${fmtDate(archive.mtime)}</span>
                    ${
                      archive.imported
                        ? `<span class="tag imported">已导入 ×${archive.imported}</span>`
                        : '<span class="tag">未导入</span>'
                    }
                  </div>
                </div>`,
            )
            .join('');
        }

        /* ------------------------------ 项目操作 ------------------------------ */
        async function handleProjectAction(id, action) {
          if (state.busy.has(id)) return;
          if (action === 'delete') {
            openDeleteConfirm(id);
            return;
          }
          if (action === 'logs') {
            openLogs(id);
            return;
          }
          if (action === 'rename') {
            openRenameModal(id);
            return;
          }
          if (action === 'git') {
            openGitModal(id);
            return;
          }

          state.busy.add(id);
          render();

          try {
            if (action === 'start') {
              const result = await api(`/api/projects/${encodeURIComponent(id)}/start`, { method: 'POST' });
              toast(`${result.project.name} 已启动`, 'success');
              await load();
              if ($('#auto-open').checked && result.project.url) {
                const opened = window.open(result.project.url, '_blank', 'noopener');
                if (!opened) toast('浏览器拦截了自动打开，请使用「打开」按钮', 'info');
              }
            } else if (action === 'stop') {
              await api(`/api/projects/${encodeURIComponent(id)}/stop`, { method: 'POST' });
              toast('项目已停止', 'success');
              await load();
            } else if (action === 'install') {
              await api(`/api/projects/${encodeURIComponent(id)}/install`, { method: 'POST' });
              toast('已开始重新安装依赖', 'success');
              await load();
              openLogs(id);
            } else if (action === 'reveal') {
              await api(`/api/projects/${encodeURIComponent(id)}/reveal`, { method: 'POST' });
            }
          } catch (err) {
            toast(err.message, 'error');
            await load();
          } finally {
            state.busy.delete(id);
            render();
          }
        }

        /* ------------------------------ 导入 ------------------------------ */
        function openImport(file) {
          const archive = state.data?.archives.find((item) => item.file === file);
          if (!archive) {
            toast('压缩包不存在，请点击刷新', 'error');
            return;
          }
          const defaultName = file.replace(/\.zip$/i, '');
          const autoStartPreferred = localStorage.getItem('arena.autoStart') !== '0';
          openModal(`
            <div class="modal" role="dialog" aria-modal="true" aria-label="导入压缩包">
            <div class="modal-head">
              <h3>导入压缩包</h3>
              <button class="icon-btn" data-close aria-label="关闭">${ICONS.close}</button>
            </div>
            <div class="modal-body">
              <div class="import-file">
                <span class="file-badge">ZIP</span>
                <div>
                  <strong>${esc(archive.file)}</strong>
                  <span class="import-meta">${fmtBytes(archive.size)}，将解压到 projects/&lt;项目名&gt;</span>
                </div>
              </div>
              <label class="field">
                <span>项目名称</span>
                <input id="import-name" maxlength="60" value="${esc(defaultName)}" autocomplete="off" spellcheck="false" />
              </label>
              <div class="steps">
                <div class="step"><span class="step-num">1</span><span>校验并解压压缩包，自动拦截非法路径</span></div>
                <div class="step"><span class="step-num">2</span><span>使用 pnpm 安装依赖，重复的包直接从全局 store 复用</span></div>
                <div class="step"><span class="step-num">3</span><span>安装完成后可直接启动，也可以勾选下方自动启动</span></div>
              </div>
              <div class="import-options">
                <label class="check"><input type="checkbox" checked disabled />导入后自动安装依赖</label>
                <label class="check"><input type="checkbox" id="import-autostart" ${
                  autoStartPreferred ? 'checked' : ''
                } />安装完成后自动启动并分配端口</label>
              </div>
            </div>
            <div class="modal-foot">
              <button class="btn ghost" data-close>取消</button>
              <button class="btn primary" id="import-submit">${ICONS.upload}${
                autoStartPreferred ? '导入并启动' : '导入并安装'
              }</button>
            </div>
            </div>`);

          const input = $('#import-name');
          const submit = $('#import-submit');
          const autoStartEl = $('#import-autostart');
          const updateSubmitLabel = () => {
            if (submit.disabled) return;
            submit.innerHTML = `${ICONS.upload}${autoStartEl.checked ? '导入并启动' : '导入并安装'}`;
          };
          autoStartEl.addEventListener('change', () => {
            localStorage.setItem('arena.autoStart', autoStartEl.checked ? '1' : '0');
            updateSubmitLabel();
          });

          const run = async () => {
            const name = input.value.trim();
            if (!name) {
              toast('请输入项目名称', 'error');
              input.focus();
              return;
            }
            const shouldStart = autoStartEl.checked;
            submit.disabled = true;
            submit.innerHTML = '<span class="mini-spinner"></span>正在导入…';
            try {
              const result = await api('/api/import', {
                method: 'POST',
                body: JSON.stringify({ archive: archive.file, name, autoStart: shouldStart }),
              });
              closeModal();
              toast(
                `${result.project.name} 已导入，${shouldStart ? '正在安装依赖并自动启动' : '正在安装依赖'}`,
                'success',
              );
              await load();
              openLogs(result.project.id);
            } catch (err) {
              toast(err.message, 'error');
              submit.disabled = false;
              updateSubmitLabel();
            }
          };
          submit.addEventListener('click', run);
          input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') run();
          });
          setTimeout(() => {
            input.focus();
            input.select();
          }, 40);
        }

        /* ------------------------------ 删除 ------------------------------ */
        function openDeleteConfirm(id) {
          const project = findProject(id);
          if (!project) return;
          openModal(`
            <div class="modal" role="dialog" aria-modal="true" aria-label="删除项目">
            <div class="modal-head">
              <h3>删除项目</h3>
              <button class="icon-btn" data-close aria-label="关闭">${ICONS.close}</button>
            </div>
            <div class="modal-body">
              <p class="confirm-text">将永久删除 <strong>${esc(project.name)}</strong> 及其目录中的全部文件（包括 node_modules）。原始压缩包不会被删除。</p>
              <div class="danger-note">${esc(project.dir)}</div>
            </div>
            <div class="modal-foot">
              <button class="btn ghost" data-close>取消</button>
              <button class="btn danger-solid" id="delete-confirm">${ICONS.trash}确认删除</button>
            </div>
            </div>`);

          const button = $('#delete-confirm');
          button.addEventListener('click', async () => {
            button.disabled = true;
            button.innerHTML = '<span class="mini-spinner"></span>正在删除…';
            try {
              await api(`/api/projects/${encodeURIComponent(id)}`, { method: 'DELETE' });
              if (state.log?.id === id) closeModal();
              toast('项目已删除', 'success');
              await load();
              closeModal();
            } catch (err) {
              toast(err.message, 'error');
              button.disabled = false;
              button.innerHTML = `${ICONS.trash}确认删除`;
            }
          });
        }

        /* ------------------------------ 重命名 ------------------------------ */
        function openRenameModal(id) {
          const project = findProject(id);
          if (!project) return;
          const runningHint =
            project.status === 'running' ? '项目正在运行，保存时会先自动停止。' : '';
          openModal(`
            <div class="modal" role="dialog" aria-modal="true" aria-label="重命名项目">
            <div class="modal-head">
              <h3>重命名项目</h3>
              <button class="icon-btn" data-close aria-label="关闭">${ICONS.close}</button>
            </div>
            <div class="modal-body">
              <label class="field">
                <span>新的项目名称</span>
                <input id="rename-name" maxlength="60" value="${esc(project.name)}" autocomplete="off" spellcheck="false" />
              </label>
              <p class="hint-line">将同步修改项目目录名、日志文件名和内部 ID；已安装的依赖会自动重新链接（几秒），端口设置保留。${runningHint}</p>
              <div class="danger-note">${esc(project.dir)}</div>
            </div>
            <div class="modal-foot">
              <button class="btn ghost" data-close>取消</button>
              <button class="btn primary" id="rename-submit">${ICONS.edit}保存名称</button>
            </div>
            </div>`);

          const input = $('#rename-name');
          const submit = $('#rename-submit');
          const run = async () => {
            const name = input.value.trim();
            if (!name) {
              toast('请输入新的项目名称', 'error');
              input.focus();
              return;
            }
            if (name === project.name) {
              closeModal();
              return;
            }
            submit.disabled = true;
            submit.innerHTML = '<span class="mini-spinner"></span>正在重命名…';
            try {
              const result = await api(`/api/projects/${encodeURIComponent(id)}/rename`, {
                method: 'POST',
                body: JSON.stringify({ name }),
              });
              closeModal();
              if (result.project.error) {
                toast(`已重命名，但${result.project.error}`, 'error');
              } else {
                toast(`已重命名为 ${result.project.name}`, 'success');
              }
              await load();
            } catch (err) {
              toast(err.message, 'error');
              submit.disabled = false;
              submit.innerHTML = `${ICONS.edit}保存名称`;
            }
          };
          submit.addEventListener('click', run);
          input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') run();
          });
          setTimeout(() => {
            input.focus();
            input.select();
          }, 40);
        }

        /* ------------------------------ Git ------------------------------ */
        const GIT_CODE_LABELS = {
          '??': '未跟踪',
          A: '新增',
          M: '修改',
          D: '删除',
          R: '重命名',
          C: '复制',
          U: '冲突',
        };

        function gitCodeLabel(code) {
          const key = Object.keys(GIT_CODE_LABELS).find((item) => code.includes(item));
          return key ? GIT_CODE_LABELS[key] : code;
        }

        function gitCodeClass(code) {
          if (code === '??') return 'untracked';
          if (code.includes('A')) return 'added';
          if (code.includes('D')) return 'deleted';
          return '';
        }

        function defaultGitMessage() {
          const date = new Date();
          const pad = (value) => String(value).padStart(2, '0');
          return `chore: 保存进度 ${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function gitChangeRow(change) {
          return `<div class="git-change"><span class="git-code ${gitCodeClass(change.code)}" title="${esc(
            gitCodeLabel(change.code),
          )}">${esc(change.code)}</span><span class="git-file">${esc(change.path)}</span></div>`;
        }

        function gitCommitRow(commit) {
          const stamp = commit.date ? new Date(commit.date).getTime() : 0;
          return `<div class="git-commit"><span class="git-hash">${esc(commit.hash)}</span><span class="git-subject" title="${esc(
            commit.subject,
          )}">${esc(commit.subject)}</span><span class="git-date">${esc(fmtDate(stamp))}</span></div>`;
        }

        async function openGitModal(id) {
          const project = findProject(id);
          if (!project) return;
          openModal(`
            <div class="modal git-modal" role="dialog" aria-modal="true" aria-label="${esc(project.name)} 的 Git 版本管理">
              <div class="modal-head">
                <div class="log-title">
                  <span class="log-name">${esc(project.name)}</span>
                </div>
                <button class="icon-btn" data-close aria-label="关闭">${ICONS.close}</button>
              </div>
              <div class="modal-body" id="git-body">
                <div class="git-loading"><span class="mini-spinner"></span>读取仓库状态…</div>
              </div>
              <div class="modal-foot" id="git-foot">
                <button class="btn ghost" data-close>关闭</button>
              </div>
            </div>`);
          await refreshGit(id);
        }

        async function refreshGit(id) {
          const body = $('#git-body');
          const foot = $('#git-foot');
          if (!body || !foot) return;

          let info;
          try {
            info = await api(`/api/projects/${encodeURIComponent(id)}/git`);
          } catch (err) {
            body.innerHTML = `<p class="git-error">${esc(err.message)}</p>`;
            return;
          }
          if (!body.isConnected) return;

          if (!info.available) {
            body.innerHTML = `
              <div class="empty small">
                <h3>未检测到 Git</h3>
                <p>请安装 Git for Windows，并确保 <code>git</code> 在 PATH 中，然后重启管理服务。</p>
              </div>`;
            foot.innerHTML = '<button class="btn ghost" data-close>关闭</button>';
            return;
          }

          if (!info.repo) {
            const project = findProject(id);
            body.innerHTML = `
              <div class="empty small">
                <h3>尚未初始化 Git</h3>
                <p>为此项目创建本地仓库，自动补充 <code>.gitignore</code>（忽略依赖与构建产物），并创建包含现有源码的初始提交。</p>
              </div>
              <div class="git-path">${esc(project?.dir || '')}</div>
              <p class="hint-line">仓库只建在项目目录内，原始压缩包不受影响；之后重命名项目，仓库会跟随目录一起移动。</p>`;
            foot.innerHTML = `
              <button class="btn ghost" data-close>取消</button>
              <button class="btn primary" id="git-init">${ICONS.git}初始化 Git</button>`;
            $('#git-init').addEventListener('click', () => gitInit(id));
            return;
          }

          const changeCount = info.changeCount || 0;
          const changes = (info.changes || []).slice(0, 80);
          const commits = info.commits || [];
          const sections = [];

          sections.push(`
            <div class="git-summary">
              <div class="git-row">
                <span class="k">分支</span>
                <code>${esc(info.branch || '（无分支）')}</code>
                <span class="git-state ${changeCount ? 'warn' : 'ok'}">${
                  changeCount ? `${changeCount} 项更改` : '工作区干净'
                }</span>
              </div>
              <div class="git-row">
                <span class="k">最近提交</span>
                ${
                  info.lastCommit
                    ? `<code>${esc(info.lastCommit.hash)}</code><span class="git-last" title="${esc(
                        info.lastCommit.subject,
                      )}">${esc(info.lastCommit.subject)}</span>`
                    : '<span class="git-dim">暂无提交</span>'
                }
              </div>
            </div>`);

          if (changeCount) {
            sections.push(`
              <section class="git-section">
                <div class="git-section-title"><span>未提交的更改</span><span>${changeCount} 项</span></div>
                <div class="git-list">
                  ${changes.map(gitChangeRow).join('')}
                  ${changeCount > changes.length ? `<div class="git-more">还有 ${changeCount - changes.length} 项未显示</div>` : ''}
                </div>
              </section>`);
            sections.push(`
              <label class="field">
                <span>提交说明</span>
                <input id="git-message" maxlength="200" value="${esc(defaultGitMessage())}" autocomplete="off" spellcheck="false" />
              </label>`);
          }

          if (commits.length) {
            sections.push(`
              <section class="git-section">
                <div class="git-section-title"><span>提交历史</span></div>
                <div class="git-list">${commits.map(gitCommitRow).join('')}</div>
              </section>`);
          }

          body.innerHTML = sections.join('');
          foot.innerHTML = `<button class="btn ghost" data-close>关闭</button>${
            changeCount ? `<button class="btn primary" id="git-commit">${ICONS.git}提交全部更改</button>` : ''
          }`;
          if (changeCount) {
            $('#git-commit').addEventListener('click', () => gitCommit(id));
          }
        }

        async function gitInit(id) {
          const button = $('#git-init');
          if (!button) return;
          button.disabled = true;
          button.innerHTML = '<span class="mini-spinner"></span>正在初始化…';
          try {
            await api(`/api/projects/${encodeURIComponent(id)}/git/init`, {
              method: 'POST',
              body: '{}',
            });
            toast('已初始化 Git 仓库并创建初始提交', 'success');
            await load();
            await refreshGit(id);
          } catch (err) {
            toast(err.message, 'error');
            button.disabled = false;
            button.innerHTML = `${ICONS.git}初始化 Git`;
          }
        }

        async function gitCommit(id) {
          const button = $('#git-commit');
          const input = $('#git-message');
          if (!button) return;
          button.disabled = true;
          if (input) input.disabled = true;
          button.innerHTML = '<span class="mini-spinner"></span>正在提交…';
          try {
            const result = await api(`/api/projects/${encodeURIComponent(id)}/git/commit`, {
              method: 'POST',
              body: JSON.stringify({ message: input?.value.trim() || '' }),
            });
            toast(result.committed ? '已提交全部更改' : '工作区已经是干净的', result.committed ? 'success' : 'info');
            await load();
            await refreshGit(id);
          } catch (err) {
            toast(err.message, 'error');
            button.disabled = false;
            if (input) input.disabled = false;
            button.innerHTML = `${ICONS.git}提交全部更改`;
          }
        }

        /* ------------------------------ 弹窗基础 ------------------------------ */
        function openModal(html) {
          if (state.log?.es) {
            state.log.es.close();
            state.log = null;
          }
          const root = $('#modal-root');
          root.innerHTML = html;
          root.classList.add('open');
          document.body.classList.add('modal-open');
        }

        function closeModal() {
          if (state.log?.es) {
            state.log.es.close();
            state.log = null;
          }
          const root = $('#modal-root');
          root.classList.remove('open');
          root.innerHTML = '';
          document.body.classList.remove('modal-open');
        }

        /* ------------------------------ 日志弹窗 ------------------------------ */
        function openLogs(id) {
          const project = findProject(id);
          if (!project) return;
          closeModal();

          const info = statusInfo(project);
          const root = $('#modal-root');
          root.innerHTML = `
            <div class="modal log-modal" role="dialog" aria-modal="true" aria-label="${esc(project.name)} 的日志">
              <div class="modal-head">
                <div class="log-title">
                  <span class="log-name">${esc(project.name)}</span>
                  <span class="status ${info.cls}" id="log-status"><i></i>${info.label}</span>
                  <span class="port" id="log-port">${project.port ? `:${project.port}` : ''}</span>
                </div>
                <div class="log-actions">
                  <label class="check subtle"><input type="checkbox" id="log-auto" checked /><span>自动滚动</span></label>
                  <button class="btn small ghost" id="log-open-btn" ${project.url ? '' : 'disabled'}>${ICONS.external}打开页面</button>
                  <button class="icon-btn" data-close aria-label="关闭">${ICONS.close}</button>
                </div>
              </div>
              <div class="log-toolbar">
                <span class="live" id="live-badge"><i></i>实时日志</span>
                <span class="hint">${esc(project.dir)}</span>
                <button class="btn small ghost" id="log-reload" style="margin-left:auto">${ICONS.refresh}重新载入</button>
              </div>
              <pre class="log-pre" id="log-pre"></pre>
            </div>`;
          root.classList.add('open');
          document.body.classList.add('modal-open');

          $('#log-open-btn').addEventListener('click', () => {
            const current = findProject(id);
            const url = safeUrl(current?.url);
            if (url) window.open(url, '_blank', 'noopener');
            else toast('当前没有可访问的地址', 'error');
          });
          $('#log-reload').addEventListener('click', () => {
            if (state.log) subscribeLogs(state.log);
          });

          state.log = {
            id,
            es: null,
            pre: $('#log-pre'),
            autoEl: $('#log-auto'),
          };
          subscribeLogs(state.log);
        }

        function subscribeLogs(logState) {
          if (!logState) return;
          logState.es?.close();
          setLive(false, '正在连接日志…');

          const source = new EventSource(`/api/projects/${encodeURIComponent(logState.id)}/logs/stream`);
          logState.es = source;

          source.addEventListener('open', () => setLive(true));
          source.addEventListener('error', () => setLive(false, '连接中断，正在重试…'));

          source.addEventListener('init', (event) => {
            try {
              const payload = JSON.parse(event.data);
              logState.pre.textContent = (payload.lines || []).join('\n') || '等待输出…\n';
              logState.pre.scrollTop = logState.pre.scrollHeight;
            } catch {
              /* 忽略 */
            }
          });

          source.addEventListener('line', (event) => {
            try {
              const payload = JSON.parse(event.data);
              const pre = logState.pre;
              const nearBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 60;
              pre.textContent += payload.text;
              if (pre.textContent.length > 600000) {
                pre.textContent = pre.textContent.slice(-400000);
              }
              if (logState.autoEl.checked && nearBottom) {
                pre.scrollTop = pre.scrollHeight;
              }
            } catch {
              /* 忽略 */
            }
          });
        }

        function setLive(ok, text) {
          const badge = $('#live-badge');
          if (!badge) return;
          badge.classList.toggle('off', !ok);
          badge.lastChild.textContent = ok ? '实时日志' : text || '连接中断';
        }

        function updateLogHeader() {
          if (!state.log) return;
          const project = findProject(state.log.id);
          if (!project) {
            closeModal();
            return;
          }
          const info = statusInfo(project);
          const statusEl = $('#log-status');
          if (statusEl) {
            statusEl.className = `status ${info.cls}`;
            statusEl.innerHTML = `<i></i>${info.label}`;
          }
          const portEl = $('#log-port');
          if (portEl) portEl.textContent = project.port ? `:${project.port}` : '';
          const openButton = $('#log-open-btn');
          if (openButton) openButton.disabled = !project.url;
        }

        /* ------------------------------ 事件绑定 ------------------------------ */
        $('#projects').addEventListener('click', (event) => {
          const importButton = event.target.closest('[data-import]');
          if (importButton) {
            openImport(importButton.dataset.import);
            return;
          }
          const button = event.target.closest('[data-action]');
          if (!button) return;
          const card = button.closest('[data-id]');
          if (!card) return;
          handleProjectAction(card.dataset.id, button.dataset.action);
        });

        $('#archives').addEventListener('click', (event) => {
          const button = event.target.closest('[data-import]');
          if (button) openImport(button.dataset.import);
        });

        $('#refresh').addEventListener('click', () => load());

        $('#rescan').addEventListener('click', async () => {
          try {
            const data = await api('/api/rescan', { method: 'POST' });
            state.data = data;
            setConnection(true);
            render();
            toast('已重新扫描项目目录', 'success');
          } catch (err) {
            toast(err.message, 'error');
          }
        });

        $('#stop-all').addEventListener('click', async () => {
          const button = $('#stop-all');
          button.disabled = true;
          try {
            const result = await api('/api/stop-all', { method: 'POST' });
            state.data = result.state;
            render();
            const stopped = result.results.filter((item) => item.ok).length;
            toast(stopped ? `已停止 ${stopped} 个项目` : '没有正在运行的项目', stopped ? 'success' : 'info');
          } catch (err) {
            toast(err.message, 'error');
          } finally {
            button.disabled = false;
          }
        });

        /* ------------------------------ 主题切换 ------------------------------ */
        const themeOptions = document.querySelectorAll('[data-theme-set]');
        function applyTheme(mode) {
          document.documentElement.dataset.theme = mode;
          themeOptions.forEach((option) => {
            option.setAttribute('aria-pressed', String(option.dataset.themeSet === mode));
          });
        }
        themeOptions.forEach((option) => {
          option.addEventListener('click', () => {
            try {
              localStorage.setItem('arena.theme', option.dataset.themeSet);
            } catch (err) {
              /* 存储不可用时仍切换当前会话 */
            }
            applyTheme(option.dataset.themeSet);
          });
        });
        applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');

        /* 没有手动选择时，跟随系统主题的实时变化 */
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (event) => {
          let stored = null;
          try {
            stored = localStorage.getItem('arena.theme');
          } catch (err) {
            /* 忽略 */
          }
          if (!stored) applyTheme(event.matches ? 'dark' : 'light');
        });

        const autoOpenInput = $('#auto-open');
        autoOpenInput.checked = localStorage.getItem('arena.autoOpen') !== '0';
        autoOpenInput.addEventListener('change', () => {
          localStorage.setItem('arena.autoOpen', autoOpenInput.checked ? '1' : '0');
        });

        $('#modal-root').addEventListener('click', (event) => {
          if (event.target === event.currentTarget) {
            closeModal();
            return;
          }
          if (event.target.closest('[data-close]')) closeModal();
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && $('#modal-root').classList.contains('open')) {
            closeModal();
          }
        });

        setInterval(() => {
          if (!document.hidden) load();
        }, 2000);

        load();
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <!-- 主动选择：Bahnschrift 是 Windows 10/11 自带字体，本工具离线运行、不下载字体。 -->
    <!-- avoid-ai-design-ignore-file: T7 -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Arena 项目管理器</title>
    <script>
      /* 在首次绘制前确定主题，避免闪烁：本地选择优先，否则跟随系统 */
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("arena.theme");
        } catch (err) {
          /* 隐私模式下 localStorage 可能不可用 */
        }
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <style>
/* ============================================================
         Arena 项目管理器 — 机台账本
         明暗两套主题共用同一组 token 角色：颜色只表示状态。
         ============================================================ */

      :root {
        color-scheme: light;

        /* 地 / 面 / 墨：冷调纸面，像项目档案夹里的索引卡 */
        --ground: #edf0f4;
        --paper: #ffffff;
        --paper-2: #f5f7fa;
        --ink: #181c23;
        --ink-soft: #3e4653;
        --muted: #5b6575;
        --dim: #7a8494;
        --line: #d6dce5;
        --line-soft: #e7ebf1;
        --line-strong: #aab4c3;
        --grid-line: rgba(62, 80, 105, 0.07);
        --row-hover: #fafbfd;
        --row-live: #f1f8f4;
        --row-error: #fdf3f1;
        --selection: #d5e2f8;

        /* 状态：绿 / 赭 / 砖红，各自只表示一种状态 */
        --run: #1b6e4f;
        --run-lamp: #2e9e6f;
        --run-soft: rgba(46, 158, 111, 0.12);
        --busy: #8a5a08;
        --busy-lamp: #c98b1e;
        --busy-soft: rgba(201, 139, 30, 0.14);
        --error: #a83a2c;
        --error-lamp: #c94f3d;
        --error-soft: rgba(201, 79, 61, 0.11);
        --stop: #7d8798;

        /* 主色：钴蓝，用于主操作、焦点和可点击强调 */
        --accent: #2b59c3;
        --accent-solid: #2b59c3;
        --on-accent: #ffffff;
        --accent-soft: rgba(43, 89, 195, 0.1);

        /* 辅助色：砖红 / 松绿 / 赭黄，像档案夹上的彩色索引标签 */
        --brick: #b23a32;
        --brick-solid: #b23a32;
        --brick-soft: rgba(178, 58, 50, 0.1);
        --pine: #1b6e4f;
        --pine-soft: rgba(27, 110, 79, 0.1);
        --ochre: #a8731d;
        --ochre-soft: rgba(168, 115, 29, 0.12);

        /* 旧名不再保留：颜色只通过上面的角色 token 取用 */

        /* 控件 */
        --focus: #2b59c3;
        --focus-ring: rgba(43, 89, 195, 0.2);
        --btn-ink: #181c23;
        --btn-ink-text: #ffffff;
        --btn-ink-hover: #2b303a;
        --scrim: rgba(20, 26, 36, 0.45);
        --shadow-modal: 0 28px 64px -30px rgba(20, 26, 36, 0.4);
        --shadow-toast: 0 16px 36px -22px rgba(20, 26, 36, 0.38);

        /* 日志纸面：浅色下与面板同一张纸，深色下保留终端面 */
        --term-bg: var(--paper-2);
        --term-ink: var(--ink);
        --term-dim: var(--muted);

        --radius: 12px;
        --radius-lg: 18px;
        --font-ui: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        --font-num: "Bahnschrift", "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", sans-serif;
        --font-mono: "Cascadia Mono", "Cascadia Code", Consolas, "Courier New", monospace;
        /* 等宽只承担路径、端口、文件名、哈希和日志这类要逐字读的标识符，不做装饰性小标签 */
      }

      [data-theme="dark"] {
        color-scheme: dark;

        --ground: #171b22;
        --paper: #1f242d;
        --paper-2: #262c36;
        --ink: #f2f3f5;
        --ink-soft: #c9d0da;
        --muted: #9aa4b2;
        --dim: #747f8e;
        --line: #343b47;
        --line-soft: #2a303a;
        --line-strong: #5a6678;
        --grid-line: rgba(190, 205, 225, 0.05);
        --row-hover: #232933;
        --row-live: #1b2a26;
        --row-error: #2d2020;
        --selection: #2c3d5c;

        --run: #63d6b0;
        --run-lamp: #3fc98c;
        --run-soft: rgba(63, 201, 140, 0.13);
        --busy: #f0c56a;
        --busy-lamp: #e0a832;
        --busy-soft: rgba(224, 168, 50, 0.14);
        --error: #ff9a8a;
        --error-lamp: #e46a5c;
        --error-soft: rgba(228, 106, 92, 0.14);
        --stop: #7e8a9d;

        --accent: #8fb0ff;
        --accent-solid: #3c5fc9;
        --on-accent: #ffffff;
        --accent-soft: rgba(143, 176, 255, 0.14);

        --brick: #ff9a8a;
        --brick-solid: #b23a32;
        --brick-soft: rgba(255, 154, 138, 0.13);
        --pine: #63d6b0;
        --pine-soft: rgba(99, 214, 176, 0.12);
        --ochre: #f2c063;
        --ochre-soft: rgba(242, 192, 99, 0.12);

        
        --focus: #8fb0ff;
        --focus-ring: rgba(143, 176, 255, 0.24);
        --btn-ink: #f2f3f5;
        --btn-ink-text: #171b22;
        --btn-ink-hover: #ffffff;
        --scrim: rgba(6, 8, 14, 0.68);
        --shadow-modal: 0 32px 74px -24px rgba(0, 0, 0, 0.76);
        --shadow-toast: 0 18px 44px -20px rgba(0, 0, 0, 0.7);

        --term-bg: #0e1112;
        --term-ink: #c9d3d4;
        --term-dim: #8d999b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: var(--ground);
        color: var(--ink);
        font-family: var(--font-ui);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body.modal-open {
        overflow: hidden;
      }

      [hidden] {
        display: none !important;
      }

      ::selection {
        background: var(--selection);
        color: var(--ink);
      }

      * {
        scrollbar-width: thin;
        scrollbar-color: var(--line-strong) transparent;
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--line-strong);
        border-radius: 6px;
        border: 3px solid transparent;
        background-clip: content-box;
      }

      /* 键盘焦点：全站统一，不能省 */
      :where(a, button, input, [tabindex]):focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .switch input:focus-visible {
        outline: none;
      }

      /* ---------- 外壳与顶栏 ---------- */

      .shell {
        max-width: 1240px;
        margin: 0 auto;
        padding: 26px 32px 40px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px 20px;
        flex-wrap: wrap;
      }

      .brand {
        display: flex;
        align-items: baseline;
        min-width: 0;
      }

      .wordmark {
        margin: 0;
        font-family: var(--font-num);
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--ink);
      }

      .wordmark-sub {
        margin-left: 8px;
        font-family: var(--font-ui);
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: 0;
        color: var(--ink);
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px 14px;
        flex-wrap: wrap;
      }

      .conn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }

      /* 指示灯：全站唯一的“亮”的语言 */
      .lamp,
      .conn i,
      .status i,
      .live i {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 1.5px;
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--stop);
        flex-shrink: 0;
      }

      /* 绿色只表示“进程正在运行”；连接、日志流这类可用状态用中性灯 */
      .conn i,
      .live i {
        background: var(--ink-soft);
        box-shadow: none;
      }

      .status.running i {
        background: var(--run-lamp);
        box-shadow: 0 0 0 2px var(--run-soft);
      }

      .conn.bad {
        color: var(--error);
      }

      .conn.bad i {
        background: var(--error-lamp);
        box-shadow: 0 0 0 2px var(--error-soft);
      }

      .theme-switch {
        display: inline-flex;
        align-items: center;
        padding: 1px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--paper);
      }

      .theme-option {
        appearance: none;
        border: 0;
        border-radius: 2px;
        padding: 4px 8px;
        background: transparent;
        color: var(--muted);
        font-family: inherit;
        font-size: 11px;
        line-height: 1;
        cursor: pointer;
        transition: background 0.14s, color 0.14s;
      }

      .theme-option:hover:not([aria-pressed="true"]) {
        color: var(--ink);
      }

      .theme-option[aria-pressed="true"] {
        background: var(--btn-ink);
        color: var(--btn-ink-text);
      }

      .switch {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }

      .switch input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .switch .track {
        position: relative;
        width: 32px;
        height: 16px;
        border: 1px solid var(--line-strong);
        border-radius: 2px;
        background: var(--paper-2);
        transition: background 0.14s, border-color 0.14s;
      }

      .switch .track::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 10px;
        height: 10px;
        border-radius: 1px;
        background: var(--line-strong);
        transition: transform 0.14s, background 0.14s;
      }

      .switch input:checked + .track {
        background: var(--btn-ink);
        border-color: var(--btn-ink);
      }

      .switch input:checked + .track::after {
        transform: translateX(16px);
        background: var(--btn-ink-text);
      }

      .switch input:focus-visible + .track {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      /* ---------- 按钮 ---------- */

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 32px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--paper);
        color: var(--ink);
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        text-decoration: none;
        transition: background 0.14s, border-color 0.14s, color 0.14s, transform 0.1s;
      }

      .btn svg {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none !important;
      }

      /* 主操作是“机器上的墨色按键”，不是彩色渐变 */
      .btn.primary {
        background: var(--btn-ink);
        border-color: var(--btn-ink);
        color: var(--btn-ink-text);
      }

      .btn.primary:not(:disabled):hover {
        background: var(--btn-ink-hover);
        border-color: var(--btn-ink-hover);
      }

      .btn.primary:not(:disabled):active {
        transform: translateY(1px);
      }

      .btn.ghost {
        background: transparent;
        border-color: var(--line);
        color: var(--ink);
      }

      .btn.ghost:not(:disabled):hover {
        background: var(--paper-2);
        border-color: var(--line-strong);
      }

      /* 行内主操作永远是同一颗墨色按键；红色只留给异常与删除 */
      .btn.stop {
        background: var(--btn-ink);
        border-color: var(--btn-ink);
        color: var(--btn-ink-text);
      }

      .btn.stop:not(:disabled):hover {
        background: var(--btn-ink-hover);
        border-color: var(--btn-ink-hover);
      }

      .btn.danger-solid {
        background: var(--error);
        border-color: var(--error);
        color: #ffffff;
      }

      .btn.danger-solid:not(:disabled):hover {
        filter: brightness(1.06);
      }

      .btn.small {
        height: 28px;
        padding: 0 10px;
        font-size: 12px;
      }

      .icon-btn {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border: 1px solid transparent;
        border-radius: 2px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: background 0.12s, color 0.12s, border-color 0.12s;
      }

      .icon-btn svg {
        width: 15px;
        height: 15px;
      }

      .icon-btn:not(:disabled):hover {
        background: var(--paper-2);
        border-color: var(--line);
        color: var(--ink);
      }

      .icon-btn.danger:not(:disabled):hover {
        color: var(--error);
        border-color: var(--error);
        background: var(--error-soft);
      }

      /* 删除与普通工具之间留出距离，误点代价最高 */
      .prow-tools .icon-btn.danger {
        margin-left: 8px;
      }

      .icon-btn:disabled {
        opacity: 0.32;
        cursor: not-allowed;
      }

      .mini-spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 1.5px solid transparent;
        border-top-color: currentColor;
        border-right-color: currentColor;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      /* ---------- 状态读数栏 ---------- */

      .rail {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 4px 20px;
        margin-top: 16px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }

      .rail-item {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        white-space: nowrap;
      }

      .rail-label {
        font-size: 12px;
        color: var(--muted);
      }

      .rail-value {
        font-family: var(--font-num);
        font-size: 15px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }

      .rail-sub {
        font-size: 11.5px;
        color: var(--dim);
      }

      .rail-note {
        margin-left: auto;
        font-size: 11.5px;
        color: var(--dim);
      }

      /* ---------- 工作台：左账本，右收件箱 ---------- */

      .workbench {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 28px;
        margin-top: 26px;
        align-items: start;
      }

      .pane {
        min-width: 0;
      }

      .pane-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        min-height: 28px;
      }

      .pane-head h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .count {
        font-size: 12px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }

      .pane-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .pane-hint {
        margin: 8px 0 0;
        font-family: var(--font-ui);
        font-size: 13px;
        line-height: 1.6;
        color: var(--dim);
        overflow-wrap: anywhere;
      }

      /* ---------- 项目账本 ---------- */

      .ledger,
      .inbox {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--paper);
        overflow: hidden;
      }

      .prow {
        position: relative;
        padding: 11px 14px;
        border-top: 1px solid var(--line-soft);
        transition: background 0.12s;
      }

      .prow:first-child {
        border-top: 0;
      }

      .prow.is-running {
        background: var(--row-live);
      }

      .prow.is-error {
        background: var(--row-error);
      }

      .prow:hover {
        background: var(--row-hover);
      }

      .prow-top {
        display: flex;
        align-items: baseline;
        gap: 12px;
        min-width: 0;
      }

      .prow-state {
        flex: 0 0 82px;
        min-width: 0;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }

      .status.running {
        color: var(--run);
      }

      .status.busy {
        color: var(--busy);
      }

      .status.busy i {
        background: var(--busy-lamp);
        box-shadow: 0 0 0 2px var(--busy-soft);
        animation: pulse 1.4s ease-in-out infinite;
      }

      .status.error {
        color: var(--error);
      }

      .status.error i {
        background: var(--error-lamp);
        box-shadow: 0 0 0 2px var(--error-soft);
      }

      .prow-name {
        margin: 0;
        flex: 1;
        min-width: 0;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
        letter-spacing: 0.005em;
        overflow-wrap: anywhere;
      }

      .port {
        font-family: var(--font-mono);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        color: var(--ink-soft);
        white-space: nowrap;
      }

      .prow-top .port {
        margin-left: auto;
      }

      .port.port-auto {
        font-family: var(--font-ui);
        font-size: 11.5px;
        color: var(--dim);
      }

      .prow-bottom {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 7px;
        padding-left: 94px;
        min-width: 0;
      }

      .prow-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
      }

      .prow-path {
        min-width: 0;
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .dep {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        color: var(--muted);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .dep::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 1px;
        background: var(--stop);
      }

      .dep.ok {
        color: var(--muted);
      }

      .dep.ok::before {
        background: var(--line-strong);
      }

      .dep.warn {
        color: var(--busy);
      }

      .dep.warn::before {
        background: var(--busy-lamp);
      }

      .dep.dim {
        color: var(--dim);
      }

      .prow-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .prow-tools {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        margin-left: 4px;
        padding-left: 8px;
        border-left: 1px solid var(--line-soft);
      }

      .project-error {
        margin: 8px 0 0 94px;
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--error-soft);
        color: var(--error);
        font-size: 11.5px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      /* ---------- 压缩包收件箱 ---------- */

      .arow {
        padding: 11px 13px;
        border-top: 1px solid var(--line-soft);
      }

      .arow:first-child {
        border-top: 0;
      }

      .arow-top {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }

      .arow-name {
        flex: 1;
        min-width: 0;
        font-family: var(--font-mono);
        font-size: 14px;
        line-height: 1.45;
        color: var(--ink);
        overflow-wrap: anywhere;
      }

      .arow-top .btn {
        height: 26px;
        padding: 0 9px;
        font-size: 11.5px;
        flex-shrink: 0;
      }

      .arow-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 6px;
        font-size: 11px;
        color: var(--dim);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--ink-soft);
        white-space: nowrap;
      }

      .tag::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 1px;
        background: var(--line-strong);
      }

      /* 已导入是既成事实，降一级；绿色只留给运行中 */
      .tag.imported {
        color: var(--dim);
      }

      .tag.imported::before {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--line-strong);
      }

      /* ---------- 空状态 ---------- */

      .empty {
        padding: 30px 22px;
        text-align: center;
      }

      .empty h3 {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
      }

      .empty p {
        max-width: 420px;
        margin: 0 auto;
        font-size: 12.5px;
        line-height: 1.7;
        color: var(--muted);
      }

      .empty .btn {
        margin-top: 14px;
      }

      .empty code {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--ink-soft);
      }

      .empty.small {
        padding: 22px 16px;
        text-align: left;
      }

      .empty.small h3 {
        font-size: 13px;
      }

      .empty.small p {
        max-width: none;
        margin: 0;
        font-size: 11.5px;
      }

      .empty.small .btn {
        margin-top: 12px;
      }

      /* ---------- 页脚 ---------- */

      .footer {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 12px;
        margin-top: 32px;
        padding-top: 14px;
        border-top: 1px solid var(--line-soft);
        color: var(--dim);
        font-size: 11px;
      }

      /* 分隔线挂在第 2 个起的条目前面，换行时不会出现行首孤竖线 */
      #env-info {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
      }

      #env-info > .env-part:not(:last-child)::after {
        content: "";
        display: inline-block;
        width: 1px;
        height: 9px;
        margin: 0 12px;
        background: var(--line);
      }

      .footer > span + span:not(:empty)::before {
        content: "";
        display: inline-block;
        width: 1px;
        height: 9px;
        margin-right: 12px;
        vertical-align: middle;
        background: var(--line);
      }

      #root-info {
        font-family: var(--font-mono);
        font-size: 13px;
      }

      /* ---------- 弹窗 ---------- */

      #modal-root {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--scrim);
      }

      #modal-root.open {
        display: flex;
        animation: fadeIn 0.12s ease;
      }

      .modal {
        display: flex;
        flex-direction: column;
        width: min(520px, 100%);
        max-height: calc(100vh - 48px);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-lg);
        background: var(--paper);
        box-shadow: var(--shadow-modal);
        overflow: hidden;
        animation: popIn 0.16s ease-out;
      }

      .modal.log-modal {
        width: min(940px, 100%);
      }

      .modal.git-modal {
        width: min(720px, 100%);
      }

      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 13px 18px;
        border-bottom: 1px solid var(--line-soft);
      }

      .modal-head h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }

      .modal-body {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 18px;
        overflow: auto;
        min-height: 0;
      }

      .modal-foot {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 18px;
        border-top: 1px solid var(--line-soft);
        background: var(--paper-2);
      }

      .import-file {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--paper-2);
      }

      .file-badge {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        border: 1px solid var(--line-strong);
        border-radius: 2px;
        font-family: var(--font-ui);
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .import-file strong {
        display: block;
        font-family: var(--font-mono);
        font-size: 13.5px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .import-meta {
        display: block;
        margin-top: 3px;
        font-size: 11px;
        color: var(--dim);
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      .field input {
        height: 36px;
        padding: 0 11px;
        border: 1px solid var(--line-strong);
        border-radius: 2px;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-ui);
        font-size: 13px;
        outline: none;
        transition: border-color 0.12s, box-shadow 0.12s;
      }

      .field input:focus {
        border-color: var(--focus);
        box-shadow: 0 0 0 3px var(--focus-ring);
      }

      .steps {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }

      .step {
        display: flex;
        gap: 9px;
        line-height: 1.55;
      }

      .step-num {
        flex-shrink: 0;
        width: 16px;
        margin-top: 1px;
        font-family: var(--font-num);
        font-size: 11px;
        color: var(--dim);
      }

      .check {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
      }

      .check input {
        width: 14px;
        height: 14px;
        accent-color: var(--btn-ink);
      }

      .check.subtle {
        font-size: 11.5px;
      }

      .import-options {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .confirm-text {
        margin: 0;
        font-size: 13px;
        line-height: 1.7;
        color: var(--muted);
      }

      .confirm-text strong {
        color: var(--ink);
      }

      .hint-line {
        margin: 0;
        font-size: 12px;
        line-height: 1.65;
        color: var(--muted);
      }

      .danger-note {
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--paper-2);
        color: var(--muted);
        font-family: var(--font-ui);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      /* ---------- Git 面板 ---------- */

      .git-loading {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 2px;
        font-size: 12px;
        color: var(--muted);
      }

      .git-summary {
        display: flex;
        flex-direction: column;
        gap: 9px;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--paper-2);
      }

      .git-row {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
        font-size: 12px;
        color: var(--muted);
      }

      .git-row .k {
        width: 58px;
        flex-shrink: 0;
        font-size: 11.5px;
        color: var(--dim);
      }

      .git-row code {
        padding: 1px 6px;
        border: 1px solid var(--line-soft);
        border-radius: 2px;
        background: var(--paper);
        color: var(--ink-soft);
        font-family: var(--font-mono);
        font-size: 13px;
      }

      .git-state {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .git-state::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 1px;
        background: currentColor;
      }

      .git-state.ok {
        color: var(--ink-soft);
      }

      .git-state.warn {
        color: var(--busy);
      }

      .git-last {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ink-soft);
      }

      .git-dim {
        color: var(--dim);
      }

      .git-path {
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: var(--paper-2);
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .git-section {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .git-section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
      }

      .git-section-title span:last-child {
        color: var(--dim);
        font-weight: 400;
      }

      .git-list {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: 2px;
        overflow: hidden;
        background: var(--paper);
      }

      .git-change {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 10px;
        border-top: 1px solid var(--line-soft);
        font-family: var(--font-mono);
        font-size: 13px;
        min-width: 0;
      }

      .git-change:first-child {
        border-top: 0;
      }

      .git-code {
        width: 22px;
        flex-shrink: 0;
        text-align: center;
        font-size: 10px;
        font-weight: 700;
        color: var(--busy);
      }

      .git-code.added,
      .git-code.untracked {
        color: var(--run);
      }

      .git-code.deleted {
        color: var(--error);
      }

      .git-file {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ink-soft);
      }

      .git-more {
        padding: 6px 10px;
        border-top: 1px solid var(--line-soft);
        font-size: 11px;
        color: var(--dim);
      }

      .git-commit {
        display: flex;
        align-items: baseline;
        gap: 9px;
        padding: 7px 10px;
        border-top: 1px solid var(--line-soft);
        min-width: 0;
      }

      .git-commit:first-child {
        border-top: 0;
      }

      .git-hash {
        flex-shrink: 0;
        color: var(--ink);
        font-family: var(--font-mono);
        font-size: 13px;
      }

      .git-subject {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        color: var(--ink-soft);
      }

      .git-date {
        flex-shrink: 0;
        color: var(--dim);
        font-size: 12px;
      }

      .git-error {
        margin: 0;
        color: var(--error);
        font-size: 13px;
        line-height: 1.6;
      }

      /* ---------- 日志弹窗：唯一的深色面 ---------- */

      .log-title {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex-wrap: wrap;
      }

      .log-name {
        font-size: 14px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .log-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .log-toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 7px 16px;
        border-bottom: 1px solid var(--line-soft);
        background: var(--paper-2);
        font-size: 13px;
        color: var(--dim);
      }

      .log-toolbar .hint {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: var(--font-mono);
        font-size: 12.5px;
      }

      .live {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--ink-soft);
        white-space: nowrap;
      }

      .live.off {
        color: var(--busy);
      }

      .live.off i {
        background: var(--busy-lamp);
        box-shadow: 0 0 0 2px var(--busy-soft);
        animation: none;
      }

      .log-pre {
        flex: 1;
        min-height: 320px;
        max-height: calc(100vh - 210px);
        margin: 0;
        padding: 14px 16px;
        overflow: auto;
        background: var(--term-bg);
        color: var(--term-ink);
        font-family: var(--font-mono);
        font-size: 13.5px;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: break-word;
        scrollbar-color: var(--line-strong) transparent;
      }

      /* ---------- Toast ---------- */

      #toasts {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 90;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: min(380px, calc(100vw - 40px));
      }

      .toast {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 10px 13px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        background: var(--paper);
        box-shadow: var(--shadow-toast);
        font-size: 12.5px;
        line-height: 1.5;
        animation: slideIn 0.18s ease-out;
        transition: opacity 0.2s, transform 0.2s;
      }

      .toast .dot {
        width: 7px;
        height: 7px;
        margin-top: 5px;
        border-radius: 1.5px;
        flex-shrink: 0;
        background: var(--ink-soft);
      }

      .toast.success .dot {
        background: var(--run-lamp);
      }

      .toast.error .dot {
        background: var(--error-lamp);
      }

      .toast.leaving {
        opacity: 0;
        transform: translateY(4px);
      }

      /* ---------- 动画 ---------- */

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes popIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }

      /* ---------- 视觉增强：更多色彩、更大字号、保留圆角 ---------- */

      body {
        font-size: 16px;
        line-height: 1.55;
        background-color: var(--ground);
        background-image:
          linear-gradient(var(--grid-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
        background-size: 28px 28px;
        background-attachment: fixed;
      }

      /* 顶栏 */
      .wordmark {
        display: flex;
        align-items: baseline;
        gap: 9px;
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .wordmark::before {
        content: "";
        align-self: center;
        width: 8px;
        height: 28px;
        flex-shrink: 0;
        border-radius: 3px;
        background: var(--accent-solid);
      }

      .wordmark-main {
        color: var(--ink);
      }

      .wordmark-sub {
        margin-left: 0;
        font-size: 15.5px;
        font-weight: 600;
        color: var(--muted);
      }

      .conn {
        font-size: 13px;
      }

      .conn i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      .theme-switch {
        gap: 2px;
        padding: 3px;
        border-radius: 10px;
      }

      .theme-option {
        padding: 6px 11px;
        border-radius: 8px;
        font-size: 13px;
      }

      .theme-option[aria-pressed="true"] {
        background: var(--accent-solid);
        color: var(--on-accent);
        box-shadow: 0 3px 8px -5px rgba(20, 26, 36, 0.4);
      }

      .switch {
        gap: 8px;
        font-size: 13px;
      }

      .switch .track {
        width: 40px;
        height: 22px;
        border-radius: 999px;
        border-color: var(--line-strong);
      }

      .switch .track::after {
        top: 3px;
        left: 3px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
      }

      .switch input:checked + .track {
        background: var(--accent-solid);
        border-color: transparent;
      }

      .switch input:checked + .track::after {
        transform: translateX(18px);
        background: #ffffff;
      }

      /* 按钮 */
      .btn {
        height: 37px;
        padding: 0 15px;
        gap: 7px;
        border-radius: 10px;
        font-size: 14px;
      }

      .btn svg {
        width: 16px;
        height: 16px;
      }

      .btn.small {
        height: 33px;
        padding: 0 12px;
        font-size: 13px;
        border-radius: 9px;
      }

      .btn.primary {
        border-color: var(--accent-solid);
        background: var(--accent-solid);
        color: var(--on-accent);
        box-shadow: 0 4px 12px -10px rgba(20, 26, 36, 0.4);
      }

      .btn.primary:not(:disabled):hover {
        border-color: var(--accent-solid);
        background: var(--accent-solid);
        filter: brightness(1.07);
      }

      .btn.ghost {
        background: var(--paper);
        border-color: var(--line);
      }

      .btn.ghost:not(:disabled):hover {
        background: color-mix(in srgb, var(--accent) 7%, var(--paper));
        border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
        color: var(--accent);
      }

      .btn.stop {
        border-color: var(--brick-solid);
        background: var(--brick-solid);
        color: #ffffff;
        box-shadow: 0 4px 12px -10px rgba(20, 26, 36, 0.4);
      }

      .btn.stop:not(:disabled):hover {
        border-color: var(--brick-solid);
        background: var(--brick-solid);
        filter: brightness(1.07);
      }

      .btn.danger-solid {
        border-color: var(--brick-solid);
        background: var(--brick-solid);
        color: #ffffff;
      }

      .icon-btn {
        width: 32px;
        height: 32px;
        border-radius: 9px;
      }

      .icon-btn svg {
        width: 17px;
        height: 17px;
      }

      .icon-btn:not(:disabled):hover {
        background: var(--accent-soft);
        border-color: color-mix(in srgb, var(--accent) 35%, transparent);
        color: var(--accent);
      }

      .icon-btn.danger:not(:disabled):hover {
        background: var(--error-soft);
        border-color: color-mix(in srgb, var(--error-lamp) 40%, transparent);
        color: var(--error);
      }

      .mini-spinner {
        width: 14px;
        height: 14px;
        border-width: 2px;
      }

      /* 概览：一行账本式小计，用细分隔线分组，不做胶囊 */
      .rail {
        align-items: stretch;
        flex-wrap: wrap;
        gap: 0;
        margin-top: 18px;
        padding: 2px 4px;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: var(--paper);
        box-shadow: 0 14px 34px -30px rgba(18, 24, 44, 0.45);
      }

      .rail-item {
        align-items: baseline;
        gap: 8px;
        padding: 9px 20px;
        border: 0;
        border-radius: 0;
        background: transparent;
        border-color: transparent;
      }

      .rail-item + .rail-item {
        border-left: 1px solid var(--line-soft);
      }

      .rail-label {
        font-size: 13px;
        color: var(--muted);
      }

      .rail-value {
        font-size: 23px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }

      .rail-sub {
        font-size: 13px;
        color: var(--muted);
      }

      .rail-note {
        margin-left: auto;
        padding: 9px 16px 9px 20px;
        font-size: 13px;
        color: var(--muted);
      }

      /* 面板 */
      .workbench {
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 26px;
        margin-top: 24px;
      }

      .pane-head {
        min-height: 30px;
        margin-bottom: 12px;
      }

      .pane-head h2 {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 17px;
        font-weight: 700;
      }

      .pane-head h2::before {
        content: "";
        width: 4px;
        height: 19px;
        border-radius: 999px;
        background: var(--accent-solid);
      }

      .workbench > .pane + .pane .pane-head h2::before {
        background: var(--ochre);
      }

      .count {
        font-size: 13.5px;
      }

      .pane-actions {
        gap: 10px;
      }

      .pane-hint {
        font-size: 13px;
      }

      .ledger,
      .inbox {
        border-color: var(--line);
        border-radius: var(--radius-lg);
        box-shadow: 0 18px 44px -36px rgba(18, 24, 44, 0.5);
      }

      /* 项目行 */
      .prow {
        padding: 16px 16px 15px 19px;
      }

      .prow:hover {
        background: var(--row-hover);
      }

      .prow.is-running {
        background: var(--row-live);
        background: color-mix(in srgb, var(--run-lamp) 7%, var(--paper));
      }

      .prow.is-error {
        background: var(--row-error);
        background: color-mix(in srgb, var(--error-lamp) 7%, var(--paper));
      }

      .prow-top {
        gap: 12px;
      }

      .prow-state {
